<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuiFill Chrome Web Store Assets</title>
    <style>
      :root {
        --ink: #202421;
        --ink-soft: #4f5752;
        --muted: #727a75;
        --canvas: #ecefed;
        --surface: #f7f8f7;
        --raised: #fbfcfb;
        --inset: #e8ebe9;
        --line: rgba(35, 48, 41, 0.11);
        --green: #376f57;
        --green-deep: #244b3b;
        --green-rich: #2e624d;
        --green-pale: #e1eee6;
        --blue-pale: #e6f0f7;
        --amber-pale: #fff1d6;
        --red-pale: #fae7e5;
        --shadow: 0 18px 46px rgba(30, 43, 36, 0.12), 0 2px 8px rgba(30, 43, 36, 0.06);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
      }
      body {
        display: grid;
        place-items: start;
      }
      button,
      input {
        font: inherit;
      }
      .asset {
        position: relative;
        overflow: hidden;
        background: var(--canvas);
      }
      .asset[hidden] {
        display: none;
      }
      .logo-img {
        display: block;
        object-fit: contain;
      }
      .eyebrow {
        color: var(--green);
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .muted {
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 26px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 720;
      }
      .pill.green {
        color: #246343;
        background: #e2f1e7;
      }
      .pill.amber {
        color: #7a5a19;
        background: var(--amber-pale);
      }
      .pill.blue {
        color: #275b76;
        background: var(--blue-pale);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5fc57e;
        box-shadow: 0 0 0 5px rgba(95, 197, 126, 0.14);
      }

      /* Promotional artwork */
      .promo-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 78% 18%, rgba(209, 239, 222, 0.18), transparent 30%),
          linear-gradient(135deg, #315f4c 0%, #214737 100%);
      }
      .promo-bg::before,
      .promo-bg::after {
        content: '';
        position: absolute;
        border: 1px solid rgba(232, 245, 237, 0.16);
        border-radius: 42px;
        transform: rotate(-8deg);
      }
      .promo-bg::before {
        width: 420px;
        height: 280px;
        right: -110px;
        top: -90px;
      }
      .promo-bg::after {
        width: 300px;
        height: 210px;
        right: -80px;
        bottom: -120px;
      }
      .logo-knockout {
        width: 62px;
        height: 62px;
        background: #e9f4ed;
        -webkit-mask: url('../../../public/icon/128.png') center / contain no-repeat;
        mask: url('../../../public/icon/128.png') center / contain no-repeat;
      }
      .promo-wordmark {
        color: #f7faf8;
        font-weight: 760;
        letter-spacing: -0.035em;
      }
      .promo-rule {
        height: 1px;
        background: rgba(239, 248, 242, 0.22);
      }
      .promo-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .promo-tag {
        padding: 7px 10px;
        border: 1px solid rgba(238, 248, 241, 0.22);
        border-radius: 999px;
        color: #d8ebe0;
        font-size: 11px;
        font-weight: 620;
      }
      .ui-float {
        background: rgba(247, 250, 248, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.44);
        box-shadow: 0 26px 68px rgba(7, 28, 19, 0.28);
        color: var(--ink);
      }
      .ui-float .bar {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .ui-float .bar i {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #cfd6d2;
      }
      .ui-float .bar i:first-child {
        background: #6fc486;
      }
      .ui-row {
        display: flex;
        align-items: center;
        gap: 9px;
        border-top: 1px solid var(--line);
      }
      .ui-check {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--green-pale);
        color: var(--green);
        font-weight: 900;
        font-size: 11px;
      }
      .ui-line {
        height: 7px;
        border-radius: 999px;
        background: #cbd4cf;
      }

      #small {
        width: 440px;
        height: 280px;
      }
      #small .small-copy {
        position: absolute;
        z-index: 2;
        left: 28px;
        top: 28px;
        width: 230px;
      }
      #small .brand-lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #small .logo-knockout {
        width: 46px;
        height: 46px;
      }
      #small .promo-wordmark {
        font-size: 31px;
      }
      #small .small-title {
        margin: 24px 0 0;
        color: #e7f2eb;
        font-size: 17px;
        line-height: 1.35;
        font-weight: 650;
        letter-spacing: -0.015em;
      }
      #small .small-ui {
        position: absolute;
        z-index: 3;
        width: 176px;
        height: 176px;
        right: -18px;
        bottom: -22px;
        border-radius: 26px;
        padding: 16px;
        transform: rotate(-3deg);
      }
      #small .small-ui .ui-row {
        padding: 11px 0;
      }

      #marquee {
        width: 1400px;
        height: 560px;
      }
      #marquee .marquee-copy {
        position: absolute;
        z-index: 2;
        left: 104px;
        top: 82px;
        width: 550px;
      }
      #marquee .brand-lockup {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      #marquee .promo-wordmark {
        font-size: 48px;
      }
      #marquee h1 {
        margin: 62px 0 18px;
        width: 620px;
        color: #f2f8f4;
        font-size: 55px;
        line-height: 1.04;
        letter-spacing: -0.045em;
      }
      #marquee p {
        margin: 0;
        width: 510px;
        color: #cfe2d7;
        font-size: 19px;
        line-height: 1.55;
      }
      #marquee .promo-tags {
        margin-top: 28px;
      }
      #marquee .promo-tag {
        font-size: 13px;
        padding: 9px 13px;
      }
      #marquee .marquee-ui {
        position: absolute;
        z-index: 3;
        width: 490px;
        height: 428px;
        right: 92px;
        top: 68px;
        border-radius: 34px;
        padding: 25px;
        transform: rotate(1.4deg);
      }
      #marquee .marquee-ui .ui-row {
        padding: 19px 0;
      }
      #marquee .marquee-ui .ui-check {
        width: 25px;
        height: 25px;
        border-radius: 7px;
        font-size: 14px;
      }
      .preview-button {
        margin-top: 20px;
        display: grid;
        place-items: center;
        height: 52px;
        border-radius: 16px;
        background: var(--green);
        color: white;
        font-size: 14px;
        font-weight: 730;
      }

      /* Store screenshots */
      .shot {
        width: 1280px;
        height: 800px;
        background: #e8ebe9;
      }
      .browser {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 22px;
        bottom: 22px;
        overflow: hidden;
        border: 1px solid rgba(32, 36, 33, 0.11);
        border-radius: 24px;
        background: #f7f8f7;
        box-shadow: 0 24px 64px rgba(30, 43, 36, 0.14);
      }
      .browser-top {
        height: 51px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #f3f5f4;
      }
      .browser-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c7ceca;
      }
      .browser-dot:nth-child(1) {
        background: #efb8ae;
      }
      .browser-dot:nth-child(2) {
        background: #edcf86;
      }
      .browser-dot:nth-child(3) {
        background: #8bc7a0;
      }
      .address-bar {
        margin-left: 9px;
        display: flex;
        align-items: center;
        width: 520px;
        height: 30px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #e9ecea;
        color: #78807b;
        font-size: 11px;
      }
      .browser-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 412px;
        height: calc(100% - 51px);
      }
      .webpage {
        position: relative;
        overflow: hidden;
        background: #f4f5f4;
      }
      .web-top {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        border-bottom: 1px solid var(--line);
        background: rgba(251, 252, 251, 0.92);
      }
      .sample-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 760;
        letter-spacing: -0.02em;
      }
      .sample-mark {
        width: 25px;
        height: 25px;
        border: 2px solid #83908a;
        border-radius: 8px 4px 8px 4px;
      }
      .web-nav {
        display: flex;
        gap: 24px;
        color: #747c77;
        font-size: 12px;
      }
      .form-shell {
        width: 720px;
        margin: 28px auto 0;
        padding: 29px 34px 33px;
        border: 1px solid rgba(32, 36, 33, 0.08);
        border-radius: 22px;
        background: #fbfcfb;
        box-shadow: 0 10px 28px rgba(30, 43, 36, 0.05);
      }
      .form-shell h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.03em;
      }
      .form-shell .lead {
        margin: 8px 0 23px;
        color: var(--muted);
        font-size: 12px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      .field label {
        display: block;
        margin-bottom: 7px;
        color: #4f5752;
        font-size: 11px;
        font-weight: 700;
      }
      .fake-input {
        display: flex;
        align-items: center;
        height: 45px;
        padding: 0 14px;
        border: 1px solid #cfd5d1;
        border-radius: 11px;
        background: white;
        color: #303632;
        font-size: 13px;
      }
      .fake-input.empty {
        color: #a1a7a3;
      }
      .fake-input.focus {
        border-color: #6c9a83;
        box-shadow: 0 0 0 3px rgba(55, 111, 87, 0.12);
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 11px;
        margin-top: 24px;
      }
      .soft-btn,
      .primary-btn {
        height: 42px;
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font-size: 12px;
        font-weight: 720;
      }
      .soft-btn {
        background: #eff1f0;
        color: #646c67;
      }
      .primary-btn {
        border-color: var(--green);
        background: var(--green);
        color: white;
      }

      .panel {
        overflow: hidden;
        border-left: 1px solid var(--line);
        background: #eff1f0;
      }
      .panel-head {
        position: relative;
        z-index: 3;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(243, 245, 244, 0.94);
      }
      .panel-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 780;
        letter-spacing: -0.04em;
      }
      .panel-brand img {
        width: 35px;
        height: 35px;
      }
      .lang-switch {
        display: flex;
        padding: 3px;
        border-radius: 11px;
        background: #e1e4e2;
        color: #626a65;
        font-size: 11px;
        font-weight: 730;
      }
      .lang-switch span {
        min-width: 39px;
        padding: 8px 9px;
        text-align: center;
        border-radius: 8px;
      }
      .lang-switch .active {
        background: #f8f9f8;
        color: var(--green-deep);
        box-shadow: 0 2px 7px rgba(30, 43, 36, 0.13);
      }
      .panel-scroll {
        height: calc(100% - 68px);
        overflow: hidden;
        padding: 16px;
      }
      .card {
        position: relative;
        padding: 20px;
        border: 1px solid rgba(32, 36, 33, 0.075);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 7px 22px rgba(30, 43, 36, 0.055);
      }
      .card + .card {
        margin-top: 14px;
      }
      .card h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.025em;
      }
      .card p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.55;
      }
      .ready-row {
        display: flex;
        align-items: flex-start;
        gap: 13px;
      }
      .shield {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--green-pale);
        color: var(--green);
      }
      .shield svg {
        width: 20px;
        height: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin-top: 16px;
        overflow: hidden;
        border-radius: 14px;
        background: var(--inset);
      }
      .stat {
        padding: 11px 4px;
        text-align: center;
        border-right: 1px solid rgba(32, 36, 33, 0.1);
      }
      .stat:last-child {
        border-right: 0;
      }
      .stat b {
        display: block;
        color: var(--green-deep);
        font-size: 14px;
      }
      .stat span {
        color: var(--muted);
        font-size: 10px;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin-top: 14px;
        padding: 4px;
        border-radius: 13px;
        background: #e6e9e7;
      }
      .tab {
        padding: 10px 4px;
        border-radius: 10px;
        color: #68706b;
        text-align: center;
        font-size: 10px;
        font-weight: 720;
      }
      .tab.active {
        background: var(--raised);
        color: var(--green-deep);
        box-shadow: 0 2px 8px rgba(30, 43, 36, 0.12);
      }
      .profile-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        padding: 13px 4px 4px;
      }
      .profile-row strong {
        display: block;
        font-size: 13px;
      }
      .profile-row span {
        color: var(--muted);
        font-size: 10px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--green-pale);
        color: var(--green-deep);
        font-size: 13px;
        font-weight: 760;
      }
      .profile-main {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .micro-btn {
        padding: 8px 11px;
        border-radius: 10px;
        background: var(--green);
        color: white;
        font-size: 10px;
        font-weight: 730;
      }
      .site-strip {
        display: grid;
        grid-template-columns: 1.4fr 0.7fr 0.7fr;
        margin: 12px 0;
        overflow: hidden;
        border-radius: 13px;
        background: #e4e7e5;
      }
      .site-strip > div {
        padding: 11px 8px;
        text-align: center;
        border-right: 1px solid rgba(32, 36, 33, 0.09);
      }
      .site-strip > div:last-child {
        border-right: 0;
      }
      .site-strip b {
        display: block;
        color: var(--green-deep);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .site-strip span {
        color: var(--muted);
        font-size: 9px;
      }
      .result-list {
        overflow: hidden;
        border: 1px solid rgba(32, 36, 33, 0.08);
        border-radius: 15px;
        background: #f4f6f4;
      }
      .result {
        display: grid;
        grid-template-columns: 46px 1fr;
        gap: 9px;
        align-items: center;
        min-height: 58px;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(32, 36, 33, 0.08);
      }
      .result:last-child {
        border-bottom: 0;
      }
      .confidence {
        display: grid;
        place-items: center;
        width: 39px;
        height: 25px;
        border-radius: 9px;
        color: #2b6847;
        background: #dff0e5;
        font-size: 9px;
        font-weight: 800;
      }
      .result b {
        display: block;
        font-size: 11px;
      }
      .result small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }
      .fill-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 13px 12px;
        border-bottom: 1px solid rgba(32, 36, 33, 0.08);
        background: #edf6f0;
      }
      .fill-row:last-child {
        border-bottom: 0;
      }
      .check {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        border-radius: 5px;
        background: #2d8a4b;
        color: white;
        font-size: 12px;
        font-weight: 900;
      }
      .fill-row b {
        display: block;
        font-size: 10px;
      }
      .fill-row small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 8.5px;
      }
      .safe-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 11px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--amber-pale);
        color: #735721;
        font-size: 9px;
        font-weight: 650;
      }
      .panel-primary {
        display: grid;
        place-items: center;
        margin-top: 12px;
        height: 46px;
        border-radius: 14px;
        background: var(--green);
        color: white;
        font-size: 12px;
        font-weight: 760;
      }
      .secure-list {
        margin-top: 15px;
        overflow: hidden;
        border-top: 1px solid var(--line);
      }
      .secure-item {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 52px;
        border-bottom: 1px solid var(--line);
        color: #555d58;
        font-size: 11px;
      }
      .secure-check {
        color: #2c9355;
        font-size: 18px;
      }
      .feature-note {
        position: absolute;
        z-index: 5;
        left: 48px;
        bottom: 42px;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 11px 15px;
        border: 1px solid rgba(32, 36, 33, 0.09);
        border-radius: 14px;
        background: rgba(250, 251, 250, 0.92);
        box-shadow: 0 10px 28px rgba(30, 43, 36, 0.09);
        color: #535b56;
        font-size: 11px;
        font-weight: 650;
      }

      .cn .form-shell {
        margin-top: 24px;
      }
      .cn .form-shell h2 {
        font-size: 23px;
      }
      .cn .field label {
        font-size: 12px;
      }
      .cn .card p {
        font-size: 11px;
      }

      .caption-ribbon {
        position: absolute;
        left: 52px;
        top: 96px;
        z-index: 6;
        padding: 9px 13px;
        border: 1px solid rgba(55, 111, 87, 0.12);
        border-radius: 999px;
        background: rgba(226, 239, 231, 0.92);
        color: var(--green-deep);
        font-size: 11px;
        font-weight: 760;
        box-shadow: 0 5px 16px rgba(30, 43, 36, 0.07);
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script>
      const logo = '<img class="logo-img" src="../../../public/icon/128.png" alt="SuiFill" />';

      function promoSmall() {
        return `<section id="small" class="asset">
          <div class="promo-bg"></div>
          <div class="small-copy">
            <div class="brand-lockup"><span class="logo-knockout"></span><span class="promo-wordmark">SuiFill</span></div>
            <p class="small-title">Local profiles.<br>Your data. Your control.</p>
          </div>
          <div class="small-ui ui-float">
            <div class="bar"><i></i><i></i><i></i></div>
            <div style="margin:16px 0 10px;font-size:12px;font-weight:760">Review before fill</div>
            <div class="ui-row"><span class="ui-check">✓</span><span class="ui-line" style="width:92px"></span></div>
            <div class="ui-row"><span class="ui-check">✓</span><span class="ui-line" style="width:76px"></span></div>
            <div class="ui-row"><span class="ui-check">✓</span><span class="ui-line" style="width:102px"></span></div>
          </div>
        </section>`;
      }

      function promoMarquee() {
        return `<section id="marquee" class="asset">

      const views = {

        'zh-overview': chineseOverview,
        security: securityShot,

      const asset = new URLSearchParams(location.search).get('asset') || 'small';
      document.documentElement.lang = asset.startsWith('zh') ? 'zh-CN' : 'en';
      document.getElementById('root').innerHTML = (views[asset] || views.small)();
